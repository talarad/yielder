# Monthly refresh of the market data (public/benchmarks.json) from data.gov.il.
#
# The regulator publishes the previous month's returns by around the 20th. This runs on the 20th
# and the following days (in case the data is late or the run fails), and commits the file only
# when something changed. Cloudflare Pages redeploys the site on that commit.

name: Market data

on:
  schedule:
    - cron: '0 6 20-25 * *'
  workflow_dispatch:
  # Re-run whenever the refresh itself changes, so a broken script shows up right away.
  push:
    paths:
      - scripts/sync-benchmarks.ts
      - .github/workflows/market-data.yml

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch the latest months
        run: npm run benchmarks:sync

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/benchmarks.json; then
            echo "No new market data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/benchmarks.json
          git commit -m "Market data: refresh from data.gov.il"
          git push
